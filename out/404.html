<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstração - TechnoUp</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; font-family: system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
        main { max-width: 30rem; padding: 2rem; border: 1px solid #e2e8f0; border-radius: 1.75rem; background: white; box-shadow: 0 10px 30px #0f172a0d; }
        h1 { margin: 0 0 1rem; font-size: 1.75rem; }
        p { color: #475569; line-height: 1.7; }
        button { margin-top: .5rem; padding: .75rem 1.25rem; border: 0; border-radius: .75rem; font: inherit; font-weight: 600; background: #2563eb; color: white; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <h1>Visualização de demonstração</h1>
        <p>Esta é só uma visualização de demonstração. Esta página não está disponível nesta versão de portfólio.</p>
        <button type="button" onclick="history.back()">Voltar</button>
    </main>
</body>
</html>
