spring.application.name=technoup
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/technoup?useUnicode=true&characterEncoding=utf8&tinyInt1isBit=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=160MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
technoup.workspace=${TECHNOUP_WORKSPACE:..}
